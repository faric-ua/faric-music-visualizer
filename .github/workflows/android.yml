name: Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VISUALIZER_DEV_KEYSTORE_B64: ${{ secrets.VISUALIZER_DEV_KEYSTORE_B64 }}
      VISUALIZER_DEV_STORE_PASSWORD: ${{ secrets.VISUALIZER_DEV_STORE_PASSWORD }}
      VISUALIZER_DEV_KEY_ALIAS: ${{ secrets.VISUALIZER_DEV_KEY_ALIAS }}
      VISUALIZER_DEV_KEY_PASSWORD: ${{ secrets.VISUALIZER_DEV_KEY_PASSWORD }}
      VISUALIZER_DEV_CERT_SHA256: ${{ secrets.VISUALIZER_DEV_CERT_SHA256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"
          cache-provider: basic

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK 36 + native toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platforms;android-36"             "build-tools;36.0.0"             "ndk;27.2.12479018"             "cmake;3.22.1"

      - name: Require stable signer for trusted builds
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VISUALIZER_DEV_KEYSTORE_B64"
          test -n "$VISUALIZER_DEV_STORE_PASSWORD"
          test -n "$VISUALIZER_DEV_KEY_ALIAS"
          test -n "$VISUALIZER_DEV_KEY_PASSWORD"
          test -n "$VISUALIZER_DEV_CERT_SHA256"

      - name: Restore stable development signer
        if: env.VISUALIZER_DEV_KEYSTORE_B64 != ''
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/faric-music-visualizer-dev.jks"
          printf '%s' "$VISUALIZER_DEV_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$VISUALIZER_DEV_STORE_PASSWORD" -alias "$VISUALIZER_DEV_KEY_ALIAS" >/dev/null
          echo "VISUALIZER_DEV_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare and verify APK
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION"
          SRC="app/build/outputs/apk/debug/app-debug.apk"
          APK="FARIC-Music-Visualizer-v${VERSION}-debug.apk"
          cp "$SRC" "$APK"

          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee signer.txt

          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signer.txt | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="$(printf '%s' "$VISUALIZER_DEV_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -E "^package:|^sdkVersion:|^targetSdkVersion:" | head -20
          sha256sum "$APK" | tee "$APK.sha256"

          echo "APK_NAME=$APK" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=FARIC-Music-Visualizer-v${VERSION}-Debug" >> "$GITHUB_ENV"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
          retention-days: 3
