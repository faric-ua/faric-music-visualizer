name: Validate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/termux-menu.sh
          bash -n tools/termux/documentation-menu.sh
          python3 -m py_compile tools/termux/import-documentation.py
          python3 -m py_compile tools/termux/render-documentation-html.py
          grep -q '20 — Documentation' scripts/termux-menu.sh
          bash -n tools/install_termux_aliases.sh
          bash -n tools/install_termux_widget.sh
          bash -n tools/termux/album-preview.sh
          python3 -m py_compile tools/termux/album_preview.py
          grep -q "21 — Прев'ю альбому" scripts/termux-menu.sh

      - name: Documentation menu and safe ZIP import smoke
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/home/storage/downloads"
          python3 - "$tmp/home/storage/downloads" <<'PY'
          from pathlib import Path
          import sys
          import zipfile
          target = Path(sys.argv[1]) / "FARIC_User_Guide_UK_v0.19.43_COMPLETE.zip"
          with zipfile.ZipFile(target, "w") as z:
              z.writestr("FARIC_User_Guide_UK_v0.19.43.pdf", b"%PDF-1.4 smoke")
              z.writestr("FARIC_User_Guide_UK_v0.19.43.html", b"<html>smoke</html>")
              z.writestr("../escape.txt", b"must not extract")
          PY
          HOME="$tmp/home" FARIC_DOC_DEST="$tmp/out" python3 tools/termux/import-documentation.py
          test -f "$tmp/out/v0.19.43/FARIC_User_Guide_UK_v0.19.43.pdf"
          test -f "$tmp/out/v0.19.43/FARIC_User_Guide_UK_v0.19.43.html"
          test ! -f "$tmp/out/escape.txt"
          test ! -f "$tmp/escape.txt"
          printf '0\n' | FARIC_DOC_DIR="$tmp/out" bash tools/termux/documentation-menu.sh >/dev/null
          # HTML must also work without previously downloaded ZIP/files.
          python3 tools/termux/render-documentation-html.py \
            docs/user/FARIC_USER_GUIDE_UK.md "$tmp/guide.html"
          test -s "$tmp/guide.html"
          grep -q 'FARIC / DOCUMENTATION' "$tmp/guide.html"
          grep -q 'data:image/' "$tmp/guide.html"
          printf '1\n\n0\n' | HOME="$tmp/home" FARIC_DOC_DIR="$tmp/not-imported" \
            bash tools/termux/documentation-menu.sh >"$tmp/offline.log"
          test -s "$tmp/home/.cache/faric-music-visualizer/documentation/FARIC_User_Guide_UK_offline.html"
          echo "Documentation menu, offline HTML and ZIP import smoke PASS"

      - name: Album preview (V144) — synthetic songs, offline
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            timeout 240 sudo -E apt-get update -qq </dev/null || true
            timeout 240 sudo -E apt-get install -y -qq --no-install-recommends ffmpeg </dev/null >/dev/null || true
          fi
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            timeout 300 python3 tools/termux/test_album_preview.py </dev/null
          else
            echo "::warning::ffmpeg не встановився на раннері — лише перевірка синтаксису й списку альбомів"
            python3 - <<'PY'
          import sys; sys.path.insert(0, "tools/termux")
          import test_album_preview as t
          t.test_unit(); t.test_order_and_tracklist(); t.test_real_config()
          PY
          fi

      - name: Repository contracts
        shell: bash
        run: |
          set -euo pipefail
          # Порядок документів з 18.10.2026: правила, стан, задачі, журнал
          test -f CLAUDE.md
          test -f STATUS.md
          test -f TODO.md
          test -f docs/PROJECT_LEDGER.md
          test -f docs/RESPONSE_ALGORITHM.md
          test -f docs/INSPECTOR.md
          grep -q 'Точка зупинки' STATUS.md
          grep -q 'Від тебе зараз' CLAUDE.md
          # Еталон експорту MP4 (18.10.2026) — не видаляти
          test -f docs/export/EXPORT_ETALON.md
          grep -q 'archive/export-etalon-v0.19.71' docs/export/EXPORT_ETALON.md
          test -f docs/UI_STYLE_CONTRACT.md
          test -f docs/UI_STYLE_AUDIT.md
          # Старі документи — лише історія, не видаляти
          for f in START_HERE_ASSISTANT CURRENT_HANDOFF ACTIVE_PLAN BUILD_CHECKPOINTS OPEN_FINDINGS BACKLOG; do
            test -f "docs/history/$f.md"
            test ! -e "$f.md"
          done
          # Меню показує новий стан
          grep -q 'STATUS.md' scripts/termux-menu.sh
          ! grep -q 'ACTIVE_PLAN' scripts/termux-menu.sh tools/termux/documentation-menu.sh
          test -f docs/product/PRODUCT_VISION.md
          test -f docs/architecture/ARCHITECTURE.md
          test -f docs/assistant-kit/AUDIO_VISUAL_CONTRACT.md
          test -f docs/v.0.1.0/RELEASE_META.json
          private_key='BEGIN (RSA |OPENSSH |EC )?PRIVATE'' KEY'
          token_a='ghp''_'
          token_b='github_pat''_'
          ! git grep -nE "$private_key|$token_a|$token_b" -- .

      - name: Stock app-owned UI guard
        shell: bash
        run: |
          set -euo pipefail
          ! git grep -nE 'AlertDialog\.Builder|android\.app\.AlertDialog|MaterialAlertDialogBuilder|import android\.widget\.Button' -- app/src/main/java

      - name: Canonical PulseDeck window contract (v0.19.75)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          ui = Path("app/src/main/java/com/saney/musicvisualizer/ui")
          dialog = (ui / "PulseDeckDialogs.kt").read_text()
          panel = (ui / "BoundedDialogPanel.kt").read_text()
          main = Path("app/src/main/java/com/saney/musicvisualizer/MainActivity.kt").read_text()
          # One template: bounded panel, scrolling message, buttons after the message.
          assert "BoundedDialogPanel(" in dialog, "show() must build its panel with BoundedDialogPanel"
          assert "panel.flexible = messageScroll" in dialog, "the message must be the flexible scrolling part"
          assert dialog.index("panel.flexible = messageScroll") < dialog.index("actions.forEachIndexed"), "buttons must follow the message"
          assert "MAX_HEIGHT_FRACTION = 0.82f" in panel and "resources.displayMetrics.heightPixels" in panel, "window height capped by the current screen"
          assert "message.length >" not in dialog, "no length threshold: every message scrolls when needed"
          # Export report keeps Copy open and per-action dismissal.
          assert "keepOpenOnSecondary = true" in main, "copy export stats must not dismiss result dialog"
          assert "val dismissOnClick: Boolean = true" in dialog
          assert "dismissAfterAction &&" in dialog and "action.dismissOnClick" in dialog, "dismissal must be per-action"
          # V62 (v0.19.80): every window is PulseDeckDialogs. The only exceptions are two
          # draggable TOOL PANELS (not message windows): Layers and the projectM settings panel.
          allowed = {
              "MainActivity.kt": {"showPulseDeckLayersDialog"},
              "ProjectMSettingsPanel.kt": {"show"},
          }
          for src in Path("app/src/main/java").rglob("*.kt"):
              if src.name == "PulseDeckDialogs.kt":
                  continue
              text = src.read_text(encoding="utf-8")
              for m in re.finditer(r"(?<![\w.])(?:android\.app\.)?Dialog\(\s*(?:this|context|\n)", text):
                  fns = re.findall(r"fun (\w+)\(", text[:m.start()])
                  fn = fns[-1] if fns else "?"
                  assert fn in allowed.get(src.name, set()), f"hand-made Dialog in {src.name}:{fn} — use PulseDeckDialogs.show"
          # V61: icon tiles — the icon in its own area, the text centred and wrapping.
          assert "val icon: String? = null" in dialog and "private fun iconTile(" in dialog, "V61 icon tile must exist"
          assert "cancelable: Boolean = true" in dialog, "progress windows need a non-cancelable canonical window"
          print("Canonical window contract PASS")
          PY

      - name: Export guard and crash journal contract (V24, V25)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import re
          from pathlib import Path
          main = Path("app/src/main/java/com/saney/musicvisualizer/MainActivity.kt").read_text()
          manifest = Path("app/src/main/AndroidManifest.xml").read_text()
          # V25: no screen switch may tear down a running export.
          for fn in ["showNowPlaying", "showLibrary", "showAllTracks", "showBoardTransform", "showThemePicker", "showExportLab"]:
              m = re.search(r"private fun " + fn + r"\([^{]*\{\s*\n\s*(.+)", main)
              assert m, fn + " not found"
              assert "blockedByActiveExport(" in m.group(1), fn + " must start with blockedByActiveExport()"
          destroy = main[main.index("override fun onDestroy()"):]
          destroy = destroy[:destroy.index("super.onDestroy()")]
          assert destroy.index("exportRunGate.isActive()") < destroy.index(".endOfflineExport()"), "onDestroy must not end offline export under a running render"
          stop = main[main.index("override fun onStop()"):]
          stop = stop[:stop.index("super.onStop()")]
          assert "exportRunGate.isActive()" in stop, "onStop must keep the export GL view alive"
          # V24: crash journal installed for the whole process and export trail recorded.
          assert 'android:name=".FaricApplication"' in manifest, "FaricApplication must be registered"
          assert "CrashJournal.exportStarted(" in main and "CrashJournal.exportFinished(" in main
          assert "maybeShowCrashReport()" in main
          # v0.19.73: one render function for single export and folder batch; V43 path A without GF background.
          assert main.count("runCompositionExportBlocking(") >= 3, "single export and batch must share runCompositionExportBlocking"
          elig = main[main.index("private fun isDirectGpuExportEligible("):]
          elig = elig[:elig.index("private fun runCompositionExportBlocking(")]
          assert "BoardLayerId.BACKGROUND" not in elig.split("): Boolean =")[1], "V43: path A must not require the GF background"
          assert "selectBatchFolder" in main and "mediaStoreHasVideo(" in main, "batch must skip videos that already exist"
          # v0.19.74: batch test — 3 s from each song, each run in its own folder, never skipped.
          assert "startBatchFolderPicker(testMode = true)" in main and "plan.testWindow(" in main and "plan.testRelativePath(" in main
          assert "!testMode && mediaStoreHasVideo(" in main, "test runs must not be skipped as already done"
          # v0.19.78: V56 — the AAC encoder is drained while waiting for input, and never waits forever.
          aac = Path("app/src/main/java/com/saney/musicvisualizer/export/AudioClipTranscoder.kt").read_text(encoding="utf-8")
          assert "onStall()" in aac and "STALL_LIMIT_MS" in aac and "fun drainEncoderOutput()" in aac, "V56: AAC encoder must be drained while waiting for input"
          # V60 — a 3 s clip analyses / decodes only its piece; analysis starts by itself.
          assert "DecodeRange.forClip(" in main and "analysisForExport(" in main, "V60: export must analyse only what the video needs"
          assert "Спочатку виконай offline analysis" not in main, "V59: export buttons keep their own names"
          print("Export guard + crash journal contract PASS")
          PY2

      - name: PulseDeck dialog text-fit contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/saney/musicvisualizer/ui/PulseDeckDialogs.kt")
          text = p.read_text()
          assert "ViewGroup.LayoutParams.WRAP_CONTENT" in text, "PulseDeck dialog actions must wrap content"
          assert "minimumHeight" in text, "PulseDeck dialog actions need a minimum touch height"
          assert "textAlignment =" in text and "View.TEXT_ALIGNMENT_CENTER" in text, "PulseDeck dialog action text must be centered"
          assert "maxLines =" in text, "PulseDeck dialog actions must allow localized multiline labels"
          PY
