name: Validate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/termux-menu.sh
          bash -n tools/termux/documentation-menu.sh
          python3 -m py_compile tools/termux/import-documentation.py
          grep -q '20 — Documentation' scripts/termux-menu.sh
          bash -n tools/install_termux_aliases.sh
          bash -n tools/install_termux_widget.sh

      - name: Documentation menu and safe ZIP import smoke
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/home/storage/downloads"
          python3 - "$tmp/home/storage/downloads" <<'PY'
          from pathlib import Path
          import sys
          import zipfile
          target = Path(sys.argv[1]) / "FARIC_User_Guide_UK_v0.19.43_COMPLETE.zip"
          with zipfile.ZipFile(target, "w") as z:
              z.writestr("FARIC_User_Guide_UK_v0.19.43.pdf", b"%PDF-1.4 smoke")
              z.writestr("FARIC_User_Guide_UK_v0.19.43.html", b"<html>smoke</html>")
              z.writestr("../escape.txt", b"must not extract")
          PY
          HOME="$tmp/home" FARIC_DOC_DEST="$tmp/out" python3 tools/termux/import-documentation.py
          test -f "$tmp/out/v0.19.43/FARIC_User_Guide_UK_v0.19.43.pdf"
          test -f "$tmp/out/v0.19.43/FARIC_User_Guide_UK_v0.19.43.html"
          test ! -f "$tmp/out/escape.txt"
          test ! -f "$tmp/escape.txt"
          printf '0\n' | FARIC_DOC_DIR="$tmp/out" bash tools/termux/documentation-menu.sh >/dev/null
          echo "Documentation menu and ZIP import smoke PASS"

      - name: Repository contracts
        shell: bash
        run: |
          set -euo pipefail
          test -f START_HERE_ASSISTANT.md
          test -f CURRENT_HANDOFF.md
          test -f ACTIVE_PLAN.md
          test -f UI_STYLE_CONTRACT.md
          test -f UI_STYLE_AUDIT.md
          test -f docs/product/PRODUCT_VISION.md
          test -f docs/architecture/ARCHITECTURE.md
          test -f docs/assistant-kit/AUDIO_VISUAL_CONTRACT.md
          test -f docs/v.0.1.0/RELEASE_META.json
          private_key='BEGIN (RSA |OPENSSH |EC )?PRIVATE'' KEY'
          token_a='ghp''_'
          token_b='github_pat''_'
          ! git grep -nE "$private_key|$token_a|$token_b" -- .

      - name: Stock app-owned UI guard
        shell: bash
        run: |
          set -euo pipefail
          ! git grep -nE 'AlertDialog\.Builder|android\.app\.AlertDialog|MaterialAlertDialogBuilder|import android\.widget\.Button' -- app/src/main/java

      - name: Export result fixed-footer contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          dialog = Path("app/src/main/java/com/saney/musicvisualizer/ui/PulseDeckDialogs.kt").read_text()
          main = Path("app/src/main/java/com/saney/musicvisualizer/MainActivity.kt").read_text()
          assert "scrollableMessage = true" in main, "export report must opt into scrollable message"
          assert "keepOpenOnSecondary = true" in main, "copy export stats must not dismiss result dialog"
          assert "val dismissOnClick: Boolean = true" in dialog, "other dialogs must retain default close behavior"
          assert "dismissOnClick =\n                                    !keepOpenOnSecondary" in dialog, "secondary action must honor keep-open option"
          assert "dismissAfterAction &&\n                            action.dismissOnClick" in dialog, "dismissal must be per-action"
          assert "if (scrollableMessage) 0 else context.dp(420)" in dialog, "scrolling message must use weighted remaining height"
          assert "weight = 1f" in dialog, "weighted scroll region required"
          assert "ViewGroup.LayoutParams.MATCH_PARENT,\n                    ViewGroup.LayoutParams.MATCH_PARENT" in dialog, "bounded dialog panel must fill viewport"
          assert "displayMetrics.heightPixels * 0.82f" in dialog, "long dialog window needs viewport height cap"
          assert dialog.index("        actions.forEachIndexed") > dialog.index("if (scrollableMessage) 0 else context.dp(420)"), "action footer must follow scrollable message"
          PY

      - name: PulseDeck dialog text-fit contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/saney/musicvisualizer/ui/PulseDeckDialogs.kt")
          text = p.read_text()
          assert "ViewGroup.LayoutParams.WRAP_CONTENT" in text, "PulseDeck dialog actions must wrap content"
          assert "minimumHeight" in text, "PulseDeck dialog actions need a minimum touch height"
          assert "textAlignment =" in text and "View.TEXT_ALIGNMENT_CENTER" in text, "PulseDeck dialog action text must be centered"
          assert "maxLines =" in text, "PulseDeck dialog actions must allow localized multiline labels"
          PY
